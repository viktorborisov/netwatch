name: CI + Deploy

# Когда запускать:
#   - push в main        -> проверить и задеплоить на VPS
#   - pull_request       -> только проверка (без деплоя)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Секреты (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   VM_HOST     — 194.87.239.102
#   VM_USER     — root (или отдельный deploy-пользователь)
#   VM_SSH_KEY  — приватный SSH-ключ; его публичная часть должна быть
#                  в ~/.ssh/authorized_keys на VPS.
#                  (у нас там уже есть github-actions-deploy)

jobs:
  # -------------------------------------------------------------------
  # 1. CI: быстрые проверки перед выкладкой
  # -------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить Python-синтаксис app.py
        run: python3 -m py_compile app.py

      - name: Проверить bash-синтаксис tracer.sh
        run: bash -n tracer.sh

      - name: Проверить, что Dockerfile собирается
        run: docker build -t netwatch:ci .

  # -------------------------------------------------------------------
  # 2. CD: выкладка на VPS (только push в main, после успешного CI)
  #    Код заливается через scp-action (не rsync — его нет/капризен),
  #    затем ssh-action пересобирает и перезапускает сервисы.
  #    На сервере НЕ нужен git-репозиторий.
  # -------------------------------------------------------------------
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Залить код на VPS (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # заливаем всё, кроме того, что не должно попасть на прод
          source: "app.py,tracer.sh,Dockerfile,docker-compose.yml,bt,README.md"
          target: "/opt/netwatch/"
          overwrite: true
          # не удаляем ничего лишнего: logs/ и образ остаются на месте

      - name: Пересобрать и перезапустить на VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/netwatch
            # пересобираем и перезапускаем веб-контейнер
            docker compose build netwatch
            docker compose up -d netwatch
            # host-трейсер перезапускаем, чтобы перечитать all.bt
            systemctl restart netwatch-tracer
            # чистим старые слои образов, чтобы не забить диск
            docker image prune -f
            echo "deploy done: $(date -u)"
