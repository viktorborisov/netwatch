services:
  netwatch:
    build: .
    image: netwatch:latest
    container_name: netwatch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # наружу не торчим; доступ через SSH-туннель
    volumes:
      - ./logs:/data:ro          # события от host-bpftrace
    environment:
      EVENTS_FILE: /data/events.jsonl
      IPDB_PATH: /app/ipdb.bin
      RING_SIZE: "1000"
      RECENT_N: "200"
    # ipdb.bin держит ~25-35MB в памяти (array start/end/idx для 2.56M
    # диапазонов). Даём запас: 192M ram + swap.
    mem_limit: 192m
    memswap_limit: 256m
    cpus: "0.5"
